    <rect x="483" y="188" width="94" height="48" rx="13" fill="#eb7617"/>
    <path d="M496 188 508 162h44l13 26" fill="#f8fafc" opacity=".85"/>
    <circle cx="504" cy="239" r="12" fill="#0f172a"/><circle cx="556" cy="239" r="12" fill="#0f172a"/>
  </g>
