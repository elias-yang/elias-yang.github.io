<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">DA3D all-weather multimodal 3D detection</title>
  <desc id="desc">A visual cover showing LiDAR and radar perception across clear, rainy, and foggy driving domains.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#243247"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4b5563"/>
      <stop offset="1" stop-color="#151b25"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="720" rx="42" fill="url(#bg)"/>
  <circle cx="1080" cy="90" r="210" fill="#eb7617" opacity=".1"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="70" y="105" fill="#ff9a4d" font-size="30" font-weight="700" letter-spacing="7">ALL-WEATHER PERCEPTION</text>
    <text x="70" y="212" fill="#fff" font-size="104" font-weight="800" letter-spacing="-4">DA3D</text>
    <text x="74" y="264" fill="#cbd5e1" font-size="30" font-weight="500">Dynamic adaptation for LiDAR–radar 3D detection</text>
  </g>
  <g transform="translate(70 330)">
    <rect width="1060" height="310" rx="28" fill="#0a0f18" opacity=".68" stroke="#536176"/>
    <path d="M370 310 493 70h74l123 240z" fill="url(#road)"/>
    <path d="M506 310 525 90M554 310 535 90" stroke="#e5e7eb" stroke-width="7" stroke-dasharray="24 20" opacity=".72"/>
    <g fill="none" stroke="#ff8a2c" stroke-width="5" filter="url(#glow)" opacity=".9">
      <path d="M530 255c-84 0-151-38-151-84s67-84 151-84 151 38 151 84-67 84-151 84z"/>
      <path d="M530 229c-58 0-105-26-105-58s47-58 105-58 105 26 105 58-47 58-105 58z"/>
    </g>
    <g fill="#67e8f9">
      <circle cx="442" cy="208" r="4"/><circle cx="458" cy="184" r="4"/><circle cx="476" cy="223" r="4"/><circle cx="493" cy="161" r="4"/><circle cx="510" cy="198" r="4"/><circle cx="548" cy="191" r="4"/><circle cx="567" cy="222" r="4"/><circle cx="585" cy="171" r="4"/><circle cx="605" cy="205" r="4"/><circle cx="620" cy="154" r="4"/>
    </g>
    <g font-family="Arial, Helvetica, sans-serif" font-weight="700" text-anchor="middle">
      <g transform="translate(145 0)">
        <circle cx="0" cy="84" r="38" fill="#fbbf24"/>
        <g stroke="#fbbf24" stroke-width="6"><path d="M0 25v-18M0 161v-18M-59 84h-18M77 84H59M-42 42l-13-13M55 139l-13-13M42 42l13-13M-55 139l13-13"/></g>
        <text y="210" fill="#fff" font-size="27">CLEAR</text>
        <text y="248" fill="#94a3b8" font-size="20" font-weight="500">Source domain</text>
      </g>
      <g transform="translate(820 0)">
        <path d="M-52 70c4-32 31-56 64-56 29 0 54 19 62 46 23 3 41 23 41 47 0 26-21 47-47 47H-47c-30 0-54-24-54-54 0-28 21-51 49-54z" fill="#94a3b8"/>
        <g stroke="#67e8f9" stroke-width="7" stroke-linecap="round"><path d="M-48 176-61 203M7 176-6 203M62 176l-13 27"/></g>
        <text y="250" fill="#fff" font-size="27">RAIN</text>
      </g>
      <g transform="translate(975 0)">
        <g stroke="#dbeafe" stroke-width="15" stroke-linecap="round" opacity=".78"><path d="M-90 74H72M-62 119H95M-95 164H54"/></g>
        <text y="250" fill="#fff" font-size="27">FOG</text>
      </g>
